<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1440px;
  background: url('bg.png') no-repeat center center;
  background-size: cover;
  font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  position: relative;
}
.layer {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.35);
}
.content {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 60px 60px 80px;
}
.top-text {
  text-align: center;
  margin-top: 30px;
}
.main-text {
  font-size: 68px;
  font-weight: 900;
  color: #fff;
  line-height: 1.3;
  letter-spacing: 4px;
  text-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 2px 8px rgba(0,0,0,0.6);
  text-align: center;
}
.bottom-section {
  text-align: center;
}
.brand {
  font-size: 52px;
  font-weight: 900;
  color: #ff8c00;
  letter-spacing: 6px;
  text-shadow: 0 4px 20px rgba(255,140,0,0.6), 0 2px 8px rgba(0,0,0,0.8);
  margin-bottom: 20px;
}
.tagline {
  font-size: 36px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 4px;
  text-shadow: 0 3px 16px rgba(0,0,0,0.8);
}
.decor-line {
  width: 300px;
  height: 4px;
  background: linear-gradient(90deg, transparent, #ff8c00, transparent);
  margin: 20px auto;
}
</style>
</head>
<body>
<div class="layer"></div>
<div class="content">
  <div class="top-text">
    <div class="main-text">一开始以为<br>只试一次不会怎样...</div>
  </div>
  <div class="bottom-section">
    <div class="brand">OpenClaw</div>
    <div class="decor-line"></div>
    <div class="tagline">结果停不下来了 🦞</div>
  </div>
</div>
</body>
</html>
