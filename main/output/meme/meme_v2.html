<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1080px;
  height: 1440px;
  background: url('bg2.png') no-repeat center center;
  background-size: cover;
  font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  position: relative;
  overflow: hidden;
}
/* Full-screen dark overlay */
.overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,0.65) 0%,
    rgba(0,0,0,0.25) 35%,
    rgba(0,0,0,0.2) 60%,
    rgba(0,0,0,0.6) 100%
  );
}
/* Main card in center */
.card {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  width: 90%;
}
/* Top quote */
.quote {
  font-size: 58px;
  font-weight: 900;
  color: #fff;
  line-height: 1.5;
  letter-spacing: 2px;
  text-shadow: 0 4px 20px rgba(0,0,0,0.9), 0 2px 6px rgba(0,0,0,0.8);
  margin-bottom: 50px;
}
/* Bottom brand block */
.brand-box {
  display: inline-block;
  background: linear-gradient(135deg, #ff6b00, #ff8c00, #ff5500);
  border-radius: 16px;
  padding: 20px 50px;
  box-shadow: 0 6px 30px rgba(255,107,0,0.5), 0 0 60px rgba(255,107,0,0.2);
}
.brand-name {
  font-size: 72px;
  font-weight: 900;
  color: #fff;
  letter-spacing: 8px;
  text-shadow: 0 3px 10px rgba(0,0,0,0.4);
  margin-bottom: 10px;
}
/* Decorative lobster emoji dots */
.dots {
  font-size: 24px;
  letter-spacing: 8px;
  color: rgba(255,255,255,0.8);
  margin-bottom: 14px;
}
.conclusion {
  font-size: 42px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 4px;
  text-shadow: 0 3px 12px rgba(0,0,0,0.6);
}
</style>
</head>
<body>
<div class="overlay">
  <div class="card">
    <div class="quote">
      一开始以为<br>只试一次不会怎样...
    </div>
    <div class="brand-box">
      <div class="dots">🦞 🦞 🦞</div>
      <div class="brand-name">OpenClaw</div>
      <div class="conclusion">结果停不下来了</div>
    </div>
  </div>
</div>
</body>
</html>
